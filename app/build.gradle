plugins {
    id 'com.android.application'
}

def signingPropsFile = rootProject.file('keystore.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def envKeystore = System.getenv('KEYSTORE_FILE') ?: ''
def hasEnvSigning = !envKeystore.isEmpty()
def hasPropSigning = signingPropsFile.exists()

android {
    namespace 'com.rea.directos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rea.directos'
        minSdk 26
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName(project.findProperty('versionName') ?: '1.0')
    }

    signingConfigs {
        release {
            if (hasEnvSigning) {
                storeFile file(envKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias (System.getenv('KEY_ALIAS') ?: 'rea')
                keyPassword (System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD'))
                storeType System.getenv('SIGNING_STORE_TYPE') ?: 'PKCS12'
            } else if (hasPropSigning) {
                storeFile rootProject.file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
                storeType signingProps.getProperty('storeType', 'PKCS12')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasEnvSigning || hasPropSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-cast:1.4.1'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
}
