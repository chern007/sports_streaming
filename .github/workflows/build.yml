name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compute version from tag
        run: |
          ARGS=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            IFS=. read -r MA MI PA <<< "$V"
            CODE=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#${PA:-0} ))
            ARGS="-PversionName=$V -PversionCode=$CODE"
            echo "Tag $GITHUB_REF_NAME -> versionName=$V versionCode=$CODE"
          fi
          echo "GRADLE_VERSION_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "${KEYSTORE_B64}" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug $GRADLE_VERSION_ARGS

      - name: Build release APK (firmada)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_TYPE: PKCS12
        run: ./gradlew --no-daemon assembleRelease $GRADLE_VERSION_ARGS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sportstreaming-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sportstreaming-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (firmada)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: SportStreaming ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Create GitHub Release (debug, sin firma)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: SportStreaming ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
